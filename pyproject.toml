[project]
name = "mc-logger"
version = "0.1.0"
description = "Unified semantic logging system optimized for AI-assisted debugging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MC Logger Contributors"}
]
dependencies = [
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "uvicorn>=0.23.0",
]
mcp = [
    "fastmcp>=2.11.0",
]
all = [
    "fastmcp>=2.11.0",
]

[project.scripts]
mc-logger-mcp = "mc_logger.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
